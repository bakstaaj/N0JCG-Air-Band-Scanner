<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>N0JCG Air Band Scanner</title><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/brand.css?v=n0jcg-brand-v4"></head>
<body>
<header><div class="brand-lockup"><img class="brand-logo" src="/assets/N0JCG_Header_Dark_Approved.png" alt="N0JCG Open Radio Platform"><span class="brand-divider" aria-hidden="true"></span><h1>Air Band Scanner</h1></div><span id="status" class="pill warn">CONNECTING</span></header>
<main>
  <section class="hero"><div><span class="label">TUNED CHANNEL</span><strong id="tuned">Not tuned</strong><span id="frequency">-</span></div><div><span class="label">SIGNAL</span><strong id="snr">-</strong><span id="scanState">Stopped</span></div><button id="scan" type="button">Scan all Airband</button><button id="listen" type="button">Listen</button><button id="stop" type="button" class="secondary">Stop</button></section>
  <section class="grid"><article><h2>Choose by airport code</h2><input id="airport" maxlength="4" placeholder="KDEN"><button id="find" type="button">Find channels</button><div id="airportResults" class="results">Enter an FAA facility code.</div></article><article><h2>FFT candidates</h2><div id="candidates" class="candidates">No spectrum candidates yet.</div></article></section>
  <p id="audioStatus" class="notice" hidden role="status"></p><pre id="log" aria-live="polite"></pre>
</main>
<footer>N0JCG Air Band Scanner · <span id="serial">00000118</span> · Receive-only; this product does not transmit.</footer>
<script src="/app.js?v=airband-controls-v2"></script>
</body></html>
